syntax = "proto3";

package entur.validation.v1;

import "gnostic/openapi/v3/annotations.proto";
import "google/api/field_behavior.proto";
import "google/protobuf/timestamp.proto";

option go_package = "github.com/entur/validation-core/gen/entur/validation/v1;validationv1";
option java_multiple_files = true;
option java_package = "no.entur.validation.proto.v1";

// A named intake point for a set of files, owned by exactly one Owner.
message DeliveryType {
  // The database id of the delivery type.
  int32 id = 1 [
    (google.api.field_behavior) = IDENTIFIER,
    (gnostic.openapi.v3.property) = {
      example: {yaml: "42"}
    }
  ];
  // The name of the delivery type.
  string name = 2 [
    (google.api.field_behavior) = REQUIRED,
    (gnostic.openapi.v3.property) = {
      example: {yaml: "\"rutedata\""}
    }
  ];
  // The database id of the owner of the delivery type.
  int32 owner = 3 [
    (google.api.field_behavior) = REQUIRED,
    (gnostic.openapi.v3.property) = {
      example: {yaml: "3"}
    }
  ];

  // The timestamp of the delivery type.
  google.protobuf.Timestamp updated_at = 100 [(gnostic.openapi.v3.property) = {
    example: {yaml: "\"2026-01-01T00:00:00Z\""}
  }];
}
